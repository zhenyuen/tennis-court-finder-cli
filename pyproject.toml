[project]
name = "tennis_court_scraper"
version = "0.1.0"
description = "Scrape London tennis court availability from courtfinder.app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
